# eStables virtual host for nginx (Debian 13).
#
# Install:
#   cp deploy/nginx/estables.conf /etc/nginx/sites-available/estables
#   edit server_name and root below
#   ln -s ../sites-available/estables /etc/nginx/sites-enabled/estables
#   nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d <your domain> adds the TLS server block.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

server {
    listen 80;
    listen [::]:80;
    server_name estables.example.org;

    # The document root is public/; everything else stays outside of the web.
    root /var/www/estables/public;
    index index.php;
    charset utf-8;

    # Photo uploads up to 50 MB plus form overhead (build 5).
    client_max_body_size 64m;

    access_log /var/log/nginx/estables.access.log;
    error_log /var/log/nginx/estables.error.log;

    # Static assets: every URL carries ?v=<version>, so they can be cached for long.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }

    # Everything that is not a file goes to the front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # The front controller is the only PHP file that is ever executed.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/estables.sock;
    }
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.git, .htaccess...) are never served.
    location ~ /\. {
        deny all;
    }
}
