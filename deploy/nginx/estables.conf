# eStables over HTTPS with a Let's Encrypt certificate (webroot, no
# changes to this file by certbot). Plain HTTP only answers the certificate
# checks and redirects everything else to https://example.org.
#
# Install, once estables-http.conf works and the domain points here:
#   certbot certonly --webroot -w /var/www/acme-stub -d example.org -d www.example.org
#   cp deploy/nginx/estables.conf /etc/nginx/sites-available/estables
#   replace example.org below with the domain
#   nginx -t && systemctl reload nginx
# Renewal: the certbot line of deploy/crontab.
# Add "listen [::]:80;" and "listen [::]:443 ssl;" if the server has IPv6.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

server {
    listen 80;
    server_name example.org www.example.org;
    server_tokens off;

    # Let's Encrypt checks the domain through these files (certbot --webroot).
    location ^~ /.well-known/acme-challenge {
        default_type "text/plain";
        allow all;
        root /var/www/acme-stub;
    }

    location / {
        rewrite ^(.*)$ https://example.org$1 permanent;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.org www.example.org;
    ssl_certificate         /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/example.org/privkey.pem;

    include /etc/nginx/snippets/estables-app.conf;
}
