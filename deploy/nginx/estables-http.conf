# eStables over plain HTTP: the sandbox, and a new server until it has a
# certificate. On a public site switch to estables.conf afterwards.
#
# Install:
#   cp deploy/nginx/estables-app.conf /etc/nginx/snippets/estables-app.conf
#   cp deploy/nginx/estables-http.conf /etc/nginx/sites-available/estables
#   edit server_name below
#   ln -s ../sites-available/estables /etc/nginx/sites-enabled/estables
#   mkdir -p /var/www/acme-stub
#   nginx -t && systemctl reload nginx
# Add "listen [::]:80;" if the server has IPv6.
#
# SPDX-License-Identifier: AGPL-3.0-or-later

server {
    listen 80;
    server_name example.org www.example.org;

    # Let's Encrypt checks the domain through these files (certbot --webroot).
    location ^~ /.well-known/acme-challenge {
        default_type "text/plain";
        allow all;
        root /var/www/acme-stub;
    }

    include /etc/nginx/snippets/estables-app.conf;
}
