# fail2ban filter for failed sign-ins to eStables.
#
# Matches lines of var/log/estables.log such as
#   [2026-10-27 14:05:09 +0300] WARNING: Login failed for "keeper" from 203.0.113.24
#   [2026-10-27 14:05:31 +0300] WARNING: Login failed for "keeper" from 203.0.113.24: locked out
# The login is written with quotes and line breaks escaped, so a typed
# login cannot imitate another address.
#
# Install: see deploy/fail2ban/jail.d/estables.conf
#
# SPDX-License-Identifier: AGPL-3.0-or-later

[Definition]
failregex = ^\s*WARNING: Login failed for "(?:[^"\\]|\\.)*" from <ADDR>(?:: [a-z ]+)?$
ignoreregex =
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S %%z\]
