# fail2ban jail for eStables: bans an address that keeps failing to sign in.
# The engine itself blocks the form after a few failures (section "login" of
# config.php); fail2ban stops such an address at the firewall.
#
# Install (Debian 13):
#   apt install fail2ban
#   cp deploy/fail2ban/filter.d/estables.conf /etc/fail2ban/filter.d/
#   cp deploy/fail2ban/jail.d/estables.conf /etc/fail2ban/jail.d/
#   fail2ban-client reload
# Check the filter against the log:
#   fail2ban-regex /var/www/estables/var/log/estables.log /etc/fail2ban/filter.d/estables.conf
#
# SPDX-License-Identifier: AGPL-3.0-or-later

[estables]
enabled = true
filter = estables
port = http,https
logpath = /var/www/estables/var/log/estables.log
# The log is a plain file, not the systemd journal.
backend = auto
maxretry = 10
findtime = 10m
bantime = 1h
