; eStables pool for php8.4-fpm (Debian 13).
;
; Install:
;   cp deploy/php-fpm/estables.conf /etc/php/8.4/fpm/pool.d/estables.conf
;   systemctl reload php8.4-fpm
; The pool runs as www-data; var/ and public/media/ must be writable by it.
;
; SPDX-License-Identifier: AGPL-3.0-or-later

[estables]
user = www-data
group = www-data

listen = /run/php/estables.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Only the front controller runs PHP.
security.limit_extensions = .php

; Photo uploads (build 5): 50 MB per file
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60

; Errors go to the log, never to visitors.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
